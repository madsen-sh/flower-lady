<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>خروجی مدل Flower Lady</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><body><h1>خروجی مدل بازسازی‌شده</h1><p>مدل مفهومی از عکس؛ ابعاد و ساختار واقعی تأیید نشده‌اند.</p><button id="export">دریافت فایل GLB</button><p id="status"></p><script type="module">
import {buildGarment} from './garment-model.js';import {GLTFExporter} from './vendor/GLTFExporter.js';
document.querySelector('#export').addEventListener('click',async()=>{const s=document.querySelector('#status');s.textContent='در حال ساخت فایل…';try{const model=buildGarment();model.traverse(o=>{if(o.material){o.material=o.material.clone();o.material.normalMap=null;}});const buffer=await new GLTFExporter().parseAsync(model,{binary:true});const url=URL.createObjectURL(new Blob([buffer],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='flowerlady-satin-reconstruction.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);s.textContent='فایل ساخته شد.';}catch(e){s.textContent='خطا: '+e.message;}});
</script></body></html>
